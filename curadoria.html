<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOMINEI · Administração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Archivo+Black&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --ink:#030710; --card:rgba(13,23,40,.85); --card2:#0E1A2E;
          --glass:linear-gradient(168deg, rgba(15,26,45,.9), rgba(7,13,24,.95));
          --line:rgba(132,170,214,.14); --line-v:rgba(47,224,141,.3);
          --text:#EAF2EC; --dim:#7E8CA0; --faint:#4C5870;
          --verde:#2FE08D; --verde2:#57F2AE; --amarelo:#F2B33D; --vermelho:#ED5A5A;
          --nd:#39435C; --ouro:#F5C542; --blue:#4D8DFF; --roxo:#9D7BFF;
          --light:rgba(132,170,214,.08); --radius:14px;
          --mono:"SF Mono", ui-monospace, Menlo, Consolas, monospace; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Atkinson Hyperlegible', -apple-system, sans-serif;
    background:
      radial-gradient(1000px 500px at 80% -10%, rgba(47,224,141,.07), transparent 60%),
      repeating-linear-gradient(0deg, rgba(120,160,220,.02) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(90deg, rgba(120,160,220,.02) 0 1px, transparent 1px 46px),
      var(--ink);
    color:var(--text); min-height:100vh; }
  button { cursor:pointer; border:none; border-radius:9px; padding:9px 15px; font-size:13px; font-weight:700; font-family:inherit; }
  input, select, textarea { width:100%; border:1px solid var(--line); border-radius:9px; padding:10px 11px;
    font-size:14px; margin-bottom:10px; background:rgba(8,14,26,.8); color:var(--text); font-family:inherit; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:rgba(47,224,141,.4);
    box-shadow:0 0 0 3px rgba(47,224,141,.08); }
  select option { background:var(--card2); }
  textarea { min-height:70px; }
  label { font-size:10.5px; font-weight:700; color:var(--dim); display:block; margin-bottom:4px;
    font-family:var(--mono); letter-spacing:.1em; }

  /* ---------- layout: sidebar desktop / tabbar mobile ---------- */
  .shell { display:block; }
  #sidenav { display:none; }
  #mobtabs { display:flex; gap:6px; overflow-x:auto; padding:10px 14px; position:sticky; top:0; z-index:20;
    background:rgba(4,9,18,.85); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  #mobtabs::-webkit-scrollbar { display:none; }
  #mobtabs button { flex:0 0 auto; background:transparent; border:1px solid var(--line); color:var(--dim);
    font-size:12px; padding:7px 12px; white-space:nowrap; }
  #mobtabs button.on { background:rgba(47,224,141,.12); color:var(--verde); border-color:var(--line-v); }
  .main { max-width:1180px; margin:0 auto; padding:22px 20px 60px; }
  @media (min-width:1024px) {
    .shell { display:grid; grid-template-columns:242px minmax(0,1fr); min-height:100vh; }
    #mobtabs { display:none; }
    #sidenav { display:flex; flex-direction:column; gap:4px; padding:22px 14px; position:sticky; top:0;
      height:100vh; border-right:1px solid var(--line); background:rgba(4,9,18,.55); }
    #sidenav .brand { font-family:'Archivo Black', sans-serif; font-size:19px; letter-spacing:.06em;
      padding:2px 10px 4px; }
    #sidenav .brand i { font-style:normal; color:var(--verde); text-shadow:0 0 16px rgba(47,224,141,.6); }
    #sidenav .sub { font-family:var(--mono); font-size:8.5px; letter-spacing:.22em; color:var(--faint);
      padding:0 10px 18px; }
    #sidenav button { display:flex; align-items:center; gap:11px; background:transparent; color:var(--dim);
      font-size:13.5px; font-weight:700; padding:11px 12px; border-radius:11px; text-align:left; }
    #sidenav button svg { width:17px; height:17px; flex:0 0 auto; }
    #sidenav button:hover { color:var(--text); background:var(--light); }
    #sidenav button.on { color:var(--verde); background:rgba(47,224,141,.1); }
    #sidenav .nb { margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--amarelo);
      background:rgba(242,179,61,.12); border-radius:99px; padding:1px 8px; }
    #sidenav .foot { margin-top:auto; padding:10px; font-size:11px; color:var(--faint); font-family:var(--mono); word-break:break-all; }
    #sidenav .foot button { padding:6px 10px; font-size:11px; margin-top:6px; border:1px solid var(--line); color:var(--dim); background:none; }
  }

  .card { background:var(--glass); border:1px solid var(--line); border-radius:var(--radius); padding:18px;
    margin-bottom:14px; box-shadow:inset 0 1px 0 rgba(255,255,255,.04); }
  .login { max-width:380px; margin:9vh auto; }
  .login h2 { margin-bottom:14px; font-size:20px; font-family:'Archivo', sans-serif; }
  .login a { color:var(--verde); }
  .b-primary { background:linear-gradient(180deg, var(--verde2), var(--verde) 55%, #1FC77A); color:#04130B; width:100%;
    box-shadow:0 5px 24px rgba(47,224,141,.25); font-weight:800; padding:12px; }
  .msg { font-size:13px; color:var(--vermelho); min-height:18px; margin-top:6px; }
  .pagetitle { font-family:'Archivo Black', sans-serif; font-size:21px; letter-spacing:.14em; margin-bottom:4px; }
  .pagesub { color:var(--dim); font-size:13px; margin-bottom:18px; }
  .filters { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .filters select, .filters input { width:auto; margin:0; min-width:130px; }
  .count { font-size:12px; color:var(--dim); margin-bottom:12px; font-family:var(--mono); letter-spacing:.04em; }
  .empty { text-align:center; color:var(--dim); padding:30px 10px; font-size:14px; }
  .more { width:100%; background:transparent; border:1px dashed var(--line); color:var(--dim); }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); color:#04130B;
           padding:11px 18px; border-radius:10px; font-size:13px; font-weight:700; display:none; z-index:50; }
  .hint { font-size:12px; color:var(--faint); margin-top:-6px; margin-bottom:8px; }
  .meta { font-size:13px; color:var(--dim); margin:3px 0 8px; }
  .nome { font-size:16px; font-weight:800; font-family:'Archivo', sans-serif; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .b-ghost { background:transparent; color:var(--dim); border:1px solid var(--line); }
  .b-ghost:hover { color:var(--text); }
  .b-ok { background:rgba(47,224,141,.14); color:var(--verde); border:1px solid rgba(47,224,141,.4); }
  .b-ok:hover { background:rgba(47,224,141,.22); }
  .b-edit { background:rgba(77,141,255,.14); color:var(--blue); border:1px solid rgba(77,141,255,.4); }
  .b-merge { background:rgba(157,123,255,.14); color:var(--roxo); border:1px solid rgba(157,123,255,.4); }
  .b-split { background:rgba(242,179,61,.12); color:var(--amarelo); border:1px solid rgba(242,179,61,.4); }
  .b-no { background:transparent; color:var(--vermelho); border:1px solid rgba(237,90,90,.45); }
  .b-no:hover { background:rgba(237,90,90,.1); }
  .subform { background:rgba(8,14,26,.6); border:1px solid var(--line); border-radius:11px; padding:14px; margin-top:10px; }
  .row2 { display:flex; gap:10px; } .row2 > * { flex:1; }
  .badge { font-size:9.5px; font-weight:700; padding:3px 10px; border-radius:6px; text-transform:uppercase;
    font-family:var(--mono); letter-spacing:.1em; color:var(--blue);
    background:rgba(77,141,255,.12); border:1px solid rgba(77,141,255,.35); display:inline-block; }
  .badge.item { color:var(--amarelo); background:rgba(242,179,61,.1); border-color:rgba(242,179,61,.35); }
  .badge.edge { color:var(--verde); background:rgba(47,224,141,.1); border-color:rgba(47,224,141,.35); }
  .badge.edital_node { color:var(--roxo); background:rgba(157,123,255,.1); border-color:rgba(157,123,255,.35); }
  .badge.ouro { color:var(--ouro); background:rgba(245,197,66,.1); border-color:rgba(245,197,66,.4); }
  .badge.red { color:var(--vermelho); background:rgba(237,90,90,.1); border-color:rgba(237,90,90,.4); }
  .badge.grey { color:var(--dim); background:var(--light); border-color:var(--line); }
  .conf { font-size:11px; color:var(--dim); font-weight:700; font-family:var(--mono); }
  .conf.baixa { color:var(--vermelho); }
  .sins { font-size:12px; color:var(--dim); }
  .sins span { background:var(--light); border:1px solid var(--line); border-radius:6px; padding:2px 9px;
    margin-right:5px; display:inline-block; margin-bottom:4px; }
  .evid { background:rgba(242,179,61,.07); border:1px solid rgba(242,179,61,.25); border-radius:9px;
    padding:9px 11px; font-size:13px; margin:8px 0; color:#E8D5AC; }
  .prop { border-left:3px solid var(--blue); }

  /* dashboard */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .kpi { background:var(--glass); border:1px solid var(--line); border-radius:13px; padding:14px; cursor:pointer; }
  .kpi:hover { border-color:var(--line-v); }
  .kpi .v { font-family:'Archivo Black', sans-serif; font-size:24px; }
  .kpi .k { font-family:var(--mono); font-size:8.5px; letter-spacing:.18em; color:var(--dim); margin-top:3px; }
  .kpi.warn .v { color:var(--amarelo); } .kpi.bad .v { color:var(--vermelho); } .kpi.good .v { color:var(--verde); }
  table.tb { width:100%; border-collapse:collapse; font-size:13px; }
  table.tb th { text-align:left; font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:var(--dim);
    padding:7px 8px; border-bottom:1px solid var(--line); }
  table.tb td { padding:8px; border-bottom:1px solid rgba(132,170,214,.07); }
  .bar { height:5px; border-radius:99px; background:rgba(132,170,214,.12); overflow:hidden; min-width:70px; }
  .bar i { display:block; height:100%; background:var(--verde); }

  /* árvore do edital */
  .disc { margin-bottom:6px; }
  .disc > .dh { display:flex; align-items:center; gap:10px; cursor:pointer; padding:9px 10px; border-radius:9px; }
  .disc > .dh:hover { background:var(--light); }
  .disc > .dh b { font-family:'Archivo', sans-serif; font-size:14.5px; }
  .disc .body { display:none; padding-left:12px; }
  .disc.open .body { display:block; }
  .ass { font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; color:var(--dim); margin:9px 0 3px; }
  .top-row { display:flex; align-items:center; gap:9px; padding:5px 8px; border-radius:8px; font-size:13px; }
  .top-row:hover { background:var(--light); }
  .top-row .pw { font-family:var(--mono); font-size:11px; color:var(--dim); min-width:52px; text-align:right; }
  .top-row .ov { width:64px; margin:0; padding:4px 7px; font-size:12px; }
  .top-row .cov { font-family:var(--mono); font-size:10px; color:var(--faint); min-width:58px; }
  .dot-ouro { width:8px; height:10px; border-radius:50% 50% 50% 50%/62% 62% 40% 40%; background:var(--ouro);
    box-shadow:0 0 8px var(--ouro); flex:0 0 auto; }

  .qenun { font-size:14px; line-height:1.5; }
  .gab { font-family:var(--mono); font-size:11px; }
  .gab.c { color:var(--verde); } .gab.e { color:var(--vermelho); }
  details.det { margin-top:8px; }
  details.det summary { cursor:pointer; color:var(--dim); font-size:12px; }
  .mono { font-family:var(--mono); }
</style>
</head>
<body>
<div class="shell">
  <nav id="sidenav" style="visibility:hidden">
    <div class="brand">DOMINE<i>I</i></div>
    <div class="sub">ADMINISTRAÇÃO</div>
    <div id="navBtns"></div>
    <div class="foot"><span id="who2"></span><br>
      <span id="buildStamp" style="color:var(--faint)"></span><br>
      <button id="btnSair2">Sair</button></div>
  </nav>
  <div>
    <div id="mobtabs" style="display:none"></div>
    <div class="main">
      <!-- LOGIN -->
      <div class="card login" id="viewLogin" style="display:none">
        <h2 id="loginTitle">Entrar</h2>
        <label>E-mail</label><input id="email" type="email" autocomplete="username">
        <label>Senha</label><input id="senha" type="password" autocomplete="current-password">
        <button class="b-primary" id="btnEntrar">Entrar</button>
        <div class="msg" id="loginMsg"></div>
        <p style="font-size:12px;color:var(--dim);margin-top:8px">
          Primeira vez? <a href="#" id="lnkModo">Criar conta</a> (o acesso é liberado apenas para e-mails da equipe.)
        </p>
      </div>
      <!-- SEM ACESSO -->
      <div class="card" id="viewNoAccess" style="display:none">
        <div class="empty">Sua conta foi criada, mas este e-mail não está na lista da equipe.<br>Fale com o Fábio para liberar o acesso.</div>
      </div>
      <!-- APP: panes gerados pelo registry -->
      <div id="viewApp" style="display:none"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const BUILD = '2026-08-19d'; // carimbo de versão — atualizado a cada deploy
const SB_URL = 'https://syzegzobxnhpjnbebvst.supabase.co';
const SB_KEY = 'sb_publishable_IBfOjZVIlht14DH7D6cUqQ_8woHSJ8b';
const EDGE_SONDAS = SB_URL + '/functions/v1/gerar-sondas';
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = (id) => document.getElementById(id);
const PAGE = 50;                       // regra da casa: toda lista paginada
let modoCadastro = false, editais = {}, propCache = {}, bancasCache = [], provasCache = [];

function toast(t, ok = true) {
  const el = $('toast'); el.textContent = t;
  el.style.background = ok ? 'var(--verde)' : 'var(--vermelho)';
  el.style.color = ok ? '#04130B' : '#fff';
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3200);
}
const esc = (s) => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (x) => Math.round((x ?? 0) * 1000) / 10;

// ---------- fábrica de lista paginada ----------
function criarLista({ mount, fetch, render, countEl }) {
  let off = 0, total = 0;
  const box = $(mount);
  async function load() {
    const r = await fetch(off, PAGE);
    if (!r) return;
    total = r.total ?? 0;
    if (countEl) $(countEl).textContent = total ? `${total} registro(s)` : '';
    if (!total && off === 0) box.insertAdjacentHTML('beforeend', '<div class="card empty">Nada por aqui.</div>');
    (r.rows || []).forEach(x => box.insertAdjacentHTML('beforeend', render(x)));
    off += PAGE;
    let more = box.parentElement.querySelector('.more');
    if (more) more.style.display = (total && off < total) ? 'block' : 'none';
  }
  return {
    reset() { off = 0; total = 0; box.innerHTML = ''; return this; },
    load, get total() { return total; },
  };
}

// ---------- ícones (SVG stroke, zero emoji) ----------
const IC = {
  visao: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>',
  editais: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></svg>',
  provas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h5M4 4l3 3M20 4l-3 3"/></svg>',
  bancas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V10l7-6 7 6v11M9 21v-6h6v6"/></svg>',
  itens: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>',
  qualidade: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg>',
  propostas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  solicitacoes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20v-8M12 12l-3 3M12 12l3 3"/><path d="M4 4h16M4 8h16"/></svg>',
};

// ---------- registry de abas + hash deep-link ----------
const TABS = [
  { id: 'visao',        label: 'Visão Geral',  ic: 'visao',        load: loadVisao },
  { id: 'editais',      label: 'Editais',      ic: 'editais',      load: loadEditais },
  { id: 'provas',       label: 'Provas',       ic: 'provas',       load: loadProvas },
  { id: 'bancas',       label: 'Bancas',       ic: 'bancas',       load: loadBancas },
  { id: 'itens',        label: 'Itens',        ic: 'itens',        load: loadItens },
  { id: 'qualidade',    label: 'Qualidade',    ic: 'qualidade',    load: loadQualidade },
  { id: 'propostas',    label: 'Propostas',    ic: 'propostas',    load: loadPropostas },
  { id: 'solicitacoes', label: 'Solicitações', ic: 'solicitacoes', load: loadSolicitacoes },
];
let abaAtual = null, hashParams = {};

function montarNav() {
  $('navBtns').innerHTML = TABS.map(t =>
    `<button data-tab="${t.id}">${IC[t.ic]}<span>${t.label}</span><span class="nb" id="nb-${t.id}" style="display:none"></span></button>`).join('');
  $('mobtabs').innerHTML = TABS.map(t => `<button data-tab="${t.id}">${t.label}</button>`).join('');
  $('viewApp').innerHTML = TABS.map(t => `<section id="pane-${t.id}" style="display:none"></section>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => irPara(b.dataset.tab));
}
function irPara(id, params = {}) {
  const qs = Object.entries(params).filter(([, v]) => v != null && v !== '')
    .map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  location.hash = `#/${id}${qs ? '?' + qs : ''}`;
}
function parseHash() {
  const m = location.hash.match(/^#\/([a-z]+)(?:\?(.*))?$/);
  hashParams = {};
  if (m && m[2]) m[2].split('&').forEach(p => { const [k, v] = p.split('='); hashParams[k] = decodeURIComponent(v ?? ''); });
  return (m && TABS.find(t => t.id === m[1])) ? m[1] : 'visao';
}
function ativarAba(id) {
  abaAtual = id;
  TABS.forEach(t => $('pane-' + t.id).style.display = t.id === id ? 'block' : 'none');
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
  const tab = TABS.find(t => t.id === id);
  tab.load();
}
window.addEventListener('hashchange', () => { if ($('viewApp').style.display !== 'none') ativarAba(parseHash()); });

// ---------- sessão ----------
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { show('viewLogin'); return; }
  const { data: staff } = await sb.rpc('fn_is_staff');
  if (!staff) { show('viewNoAccess'); return; }
  $('who2').textContent = session.user.email;
  montarNav();
  $('buildStamp').textContent = 'build ' + BUILD;
  show('viewApp');
  $('sidenav').style.visibility = 'visible';
  $('mobtabs').style.display = window.innerWidth >= 1024 ? 'none' : 'flex';
  await carregarEditais();
  ativarAba(parseHash());
  atualizarBadges();
}
function show(id) {
  ['viewLogin', 'viewNoAccess', 'viewApp'].forEach(v => $(v).style.display = v === id ? 'block' : 'none');
}
$('lnkModo').onclick = (e) => { e.preventDefault(); modoCadastro = !modoCadastro;
  $('loginTitle').textContent = modoCadastro ? 'Criar conta' : 'Entrar';
  $('btnEntrar').textContent = modoCadastro ? 'Criar conta' : 'Entrar';
  $('lnkModo').textContent = modoCadastro ? 'Já tenho conta' : 'Criar conta'; };
$('btnEntrar').onclick = async () => {
  $('loginMsg').textContent = '';
  const email = $('email').value.trim(), password = $('senha').value;
  const { error } = modoCadastro
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });
  if (error) { $('loginMsg').textContent = error.message; return; }
  if (modoCadastro) { $('loginMsg').textContent = 'Conta criada. Confirme pelo e-mail e entre.'; modoCadastro = false; return; }
  boot();
};
$('btnSair2').onclick = async () => { await sb.auth.signOut(); location.hash = ''; location.reload(); };

async function carregarEditais() {
  const { data, error } = await sb.rpc('fn_admin_editais_listar');
  if (error) { toast(error.message, false); return; }
  editais = {};
  (data || []).forEach(e => editais[e.id] = e);
}
async function atualizarBadges() {
  const { data } = await sb.rpc('fn_admin_dashboard');
  if (!data) return;

  };
}
function parseEstrutura(txt) {
  const estrutura = []; const erros = [];
  let disc = null, ass = null, nd = 0, na = 0, nt = 0;
  txt.split('\n').forEach((raw, i) => {
    const line = raw.trim();
    if (!line) return;
    if (line.startsWith('- ')) {
      if (!ass) { erros.push(`linha ${i + 1}: tópico antes de um assunto (">")`); return; }
      const [nome, sins] = line.slice(2).split('|');
      if (!nome.trim()) { erros.push(`linha ${i + 1}: tópico sem nome`); return; }
      ass.topicos.push({ nome: nome.trim(),
        sinonimos: (sins || '').split(',').map(s => s.trim()).filter(Boolean) });
      nt++;
    } else if (line.startsWith('>')) {
      if (!disc) { erros.push(`linha ${i + 1}: assunto antes de uma disciplina`); return; }
      ass = { assunto: line.replace(/^>+\s*/, ''), topicos: [] };
      disc.assuntos.push(ass); na++;
    } else {
      // disciplina, com nº de questões do quadro do edital opcional: "Português | 20" ou "| 20 questões"
      const m = line.replace(/^#+\s*/, '').match(/^(.*?)(?:\|\s*(\d+)\s*(?:quest(?:õ|o)es?)?\s*)?$/i);
      disc = { disciplina: (m[1] || '').trim(), assuntos: [],
               questoes: m[2] ? parseInt(m[2]) : null };
      estrutura.push(disc); ass = null; nd++;
    }
  });
  estrutura.forEach(d => {
    if (!d.assuntos.length) erros.push(`disciplina "${d.disciplina}" sem assuntos`);
    d.assuntos.forEach(a => { if (!a.topicos.length) erros.push(`assunto "${a.assunto}" sem tópicos`); });
  });
  if (!nt) erros.push('nenhum tópico encontrado');
  return { estrutura, erros, nd, na, nt };
}

}
async function fecharReportAdmin(id, status) {
  const nota = $('qnota-' + id)?.value.trim() || null;
  const { error } = await sb.rpc('fn_admin_report_fechar', { p_id: id, p_status: status, p_nota: nota });
  if (error) { toast(error.message, false); return; }
  if (status !== 'triado') $('qrep-' + id)?.remove();
  toast('Report ' + status + ' ✓'); atualizarBadges();
}

// =====================================================================
// PROPOSTAS (fila de curadoria — preservada, re-skin)
// =====================================================================
let listaProps = null;
async function loadPropostas() {
  const pane = $('pane-propostas');
  pane.innerHTML = `
    <div class="pagetitle">P R O P O S T A S</div>
    <div class="pagesub">Fila da pipeline de curadoria — as de menor confiança primeiro.</div>
    <div class="filters">
      <select id="fTipo"><option value="">Todos os tipos</option>
        <option value="node">Tópicos (nós)</option><option value="edge">Conexões</option>
        <option value="edital_node">Pesos do edital</option><option value="item">Questões</option></select>
      <select id="fEdital"><option value="">Todos os editais</option>${Object.values(editais).map(e =>
        `<option value="${e.id}">${esc(e.concurso)} · ${esc(e.cargo || '')}</option>`).join('')}</select>
    </div>
    <div class="count" id="propCount"></div>
    <div id="listaProps"></div>
    <button class="more" id="maisProps" style="display:none">Carregar mais</button>`;
  listaProps = criarLista({
    mount: 'listaProps', countEl: 'propCount',
    fetch: async (off, lim) => {
      let q = sb.from('curadoria_propostas').select('*', { count: 'exact' })
        .eq('status', 'pendente')
        .order('confianca_ia', { ascending: true, nullsFirst: false })
        .range(off, off + lim - 1);
      if ($('fTipo').value) q = q.eq('tipo', $('fTipo').value);
      if ($('fEdital').value) q = q.eq('edital_id', $('fEdital').value);
      const { data, count, error } = await q;
      if (error) { toast(error.message, false); return null; }
      (data || []).forEach(p => propCache[p.id] = p);
      return { total: count, rows: data };
    },
    render: renderProp });
  $('fTipo').onchange = () => { propCache = {}; listaProps.reset().load(); };
  $('fEdital').onchange = () => { propCache = {}; listaProps.reset().load(); };
  $('maisProps').onclick = () => listaProps.load();
  propCache = {};
  listaProps.reset().load();
}
function confHtml(c) {
  if (c == null) return '';
  const p = Math.round(c * 100);
  return `<span class="conf ${p < 60 ? 'baixa' : ''}">confiança da IA: ${p}%</span>`;
}
function evidHtml(ev) {
  if (!ev) return '';
  const txt = typeof ev === 'string' ? ev : (ev.resumo || JSON.stringify(ev));
  return `<div class="evid">${esc(txt)}</div>`;
}
function renderProp(p) {
  const pl = p.payload || {};
  let corpo = '';
  const edLabel = (id) => editais[id] ? `${editais[id].concurso} · ${editais[id].cargo || ''}` : '';
  if (p.tipo === 'node') {
    corpo = `<div class="nome">${esc(pl.nome)}</div>
      <div class="meta">${esc(pl.nivel || '')}${pl.parent_nome ? ' · dentro de: ' + esc(pl.parent_nome) : ''}</div>
      ${(pl.sinonimos || []).length ? `<div class="sins">${pl.sinonimos.map(s => `<span>${esc(s)}</span>`).join('')}</div>` : ''}`;
  } else if (p.tipo === 'edge') {
    corpo = `<div class="nome">${esc(pl.source_nome || pl.source_id)} ⟷ ${esc(pl.target_nome || pl.target_id)}</div>
      <div class="meta">conexão: ${esc(pl.tipo_aresta)} · força ${pl.forca ?? 0.5}</div>`;
  } else if (p.tipo === 'edital_node') {
    corpo = `<div class="nome">${esc(pl.node_nome || pl.node_id)}</div>
      <div class="meta">${esc(edLabel(pl.edital_id))} · peso proposto: <b>${Math.round((pl.peso ?? 0.5) * 100)}%</b>
      · incerteza: ${Math.round((pl.peso_incerteza ?? 1) * 100)}%${pl.sem_historico ? ' · <b style="color:var(--vermelho)">SEM HISTÓRICO — palavra do professor</b>' : ''}</div>`;
  } else if (p.tipo === 'item') {
    corpo = `<div class="meta">${esc(pl.tipo_item || 'certo_errado')} · uso: ${esc(pl.uso || 'geral')} · gabarito: <b>${esc(pl.gabarito)}</b></div>
      <div style="font-size:14px">${esc(pl.enunciado)}</div>`;
  }
  const podeNo = p.tipo === 'node';
  return `
    <div class="card prop" id="prop-${p.id}">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
        <span class="badge ${p.tipo}">${p.tipo === 'node' ? 'tópico' : p.tipo === 'edge' ? 'conexão' : p.tipo === 'edital_node' ? 'peso' : 'questão'}</span>
        ${confHtml(p.confianca_ia)}</div>
      ${corpo}
      ${evidHtml(p.evidencia)}
      <div class="acts">
        <button class="b-ok" onclick="decidir('${p.id}','aprovada')">Aprovar</button>
        <button class="b-edit" onclick="abrirEditar('${p.id}')">Editar</button>
        ${podeNo ? `<button class="b-merge" onclick="abrirFundir('${p.id}')">Fundir</button>
                    <button class="b-split" onclick="abrirDividir('${p.id}')">Dividir</button>` : ''}
        <button class="b-no" onclick="decidir('${p.id}','rejeitada')">Rejeitar</button>
      </div>
      <div class="subform" id="sub-${p.id}" style="display:none"></div>
    </div>`;
}
async function decidir(id, decisao, edicao = null) {
  const { error } = await sb.rpc('fn_decidir_proposta', { p_id: id, p_decisao: decisao, p_edicao: edicao });
  if (error) { toast(error.message, false); return; }
  $('prop-' + id)?.remove();
  toast(decisao === 'rejeitada' ? 'Proposta rejeitada' : 'Decisão aplicada ✓');
  atualizarBadges();
}
function abrirEditar(id) {
  const p = propCache[id], pl = p.payload || {}, box = $('sub-' + id);
  box.style.display = 'block';
  if (p.tipo === 'node') {
    box.innerHTML = `<label>Nome do tópico</label><input id="e-nome-${id}" value="${esc(pl.nome)}">
      <div class="row2"><div><label>Nível</label><select id="e-nivel-${id}">
        ${['disciplina','assunto','topico'].map(n => `<option ${pl.nivel === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div>
      <label>Sinônimos (separados por vírgula)</label><input id="e-sin-${id}" value="${esc((pl.sinonimos || []).join(', '))}">
      <button class="b-ok" onclick="salvarEdicaoNode('${id}')">Salvar e aprovar</button>`;
  } else if (p.tipo === 'edital_node') {
    box.innerHTML = `<div class="row2">
      <div><label>Peso final (%) — sua palavra final</label><input id="e-peso-${id}" type="number" min="0" max="100" value="${Math.round((pl.peso ?? .5) * 100)}"></div>
      </div><button class="b-ok" onclick="salvarEdicaoPeso('${id}')">Salvar e aprovar</button>`;
  } else if (p.tipo === 'edge') {
    box.innerHTML = `<label>Força (0–100)</label><input id="e-forca-${id}" type="number" min="0" max="100" value="${Math.round((pl.forca ?? .5) * 100)}">
      <button class="b-ok" onclick="salvarEdicaoEdge('${id}')">Salvar e aprovar</button>`;
  } else {
    box.innerHTML = `<label>Enunciado</label><textarea id="e-enun-${id}">${esc(pl.enunciado)}</textarea>
      <div class="row2"><div><label>Gabarito</label><input id="e-gab-${id}" value="${esc(pl.gabarito)}"></div>
      <div><label>Dificuldade (0–100)</label><input id="e-dif-${id}" type="number" min="0" max="100" value="${Math.round((pl.dificuldade ?? .5) * 100)}"></div></div>
      <label>Explicação</label><textarea id="e-exp-${id}">${esc(pl.explicacao || '')}</textarea>
      <button class="b-ok" onclick="salvarEdicaoItem('${id}')">Salvar e aprovar</button>`;
  }
}
function salvarEdicaoNode(id) {
  const pl = { ...propCache[id].payload };
  pl.nome = $(`e-nome-${id}`).value.trim();
  pl.nivel = $(`e-nivel-${id}`).value;
  pl.sinonimos = $(`e-sin-${id}`).value.split(',').map(s => s.trim()).filter(Boolean);
  decidir(id, 'editada', pl);
}
function salvarEdicaoPeso(id) {
  const pl = { ...propCache[id].payload };
  pl.peso_override = Math.min(100, Math.max(0, +$(`e-peso-${id}`).value)) / 100;
  decidir(id, 'editada', pl);
}
function salvarEdicaoEdge(id) {
  const pl = { ...propCache[id].payload };
  pl.forca = Math.min(100, Math.max(0, +$(`e-forca-${id}`).value)) / 100;
  decidir(id, 'editada', pl);
}
function salvarEdicaoItem(id) {
  const pl = { ...propCache[id].payload };
  pl.enunciado = $(`e-enun-${id}`).value.trim();
  pl.gabarito = $(`e-gab-${id}`).value.trim();
  pl.dificuldade = Math.min(100, Math.max(0, +$(`e-dif-${id}`).value)) / 100;
  pl.explicacao = $(`e-exp-${id}`).value.trim();
  decidir(id, 'editada', pl);
}
function abrirFundir(id) {
  const box = $('sub-' + id);
  box.style.display = 'block';
  box.innerHTML = `<label>Fundir com qual tópico existente? (digite para buscar)</label>
    <input id="f-busca-${id}" oninput="buscarNode('${id}')" placeholder="ex.: poder de polícia">
    <div id="f-res-${id}"></div>`;
}
async function buscarNode(id) {
  const termo = $(`f-busca-${id}`).value.trim();
  if (termo.length < 3) { $(`f-res-${id}`).innerHTML = ''; return; }
  const { data } = await sb.from('nodes').select('id, nome, nivel').ilike('nome', `%${termo}%`).eq('status', 'aprovado').range(0, 14);
  $(`f-res-${id}`).innerHTML = (data || []).map(n =>
    `<button class="b-merge" style="margin:3px" onclick="decidir('${id}','fundida',{fundir_em:'${n.id}'})">${esc(n.nome)} (${n.nivel})</button>`
  ).join('') || '<div class="hint">nada encontrado</div>';
}
function abrirDividir(id) {
  const p = propCache[id], pl = p.payload || {}, box = $('sub-' + id);
  box.style.display = 'block';
  box.innerHTML = `<div class="hint">Divida "${esc(pl.nome)}" em 2+ tópicos (mesmo nível e pai):</div>
    <div id="d-rows-${id}"></div>
    <button class="b-split" onclick="addParte('${id}')">+ parte</button>
    <button class="b-ok" onclick="salvarDivisao('${id}')">Salvar e aprovar divisão</button>`;
  addParte(id); addParte(id);
}
function addParte(id) {
  $(`d-rows-${id}`).insertAdjacentHTML('beforeend', `<input class="d-parte-${id}" placeholder="nome da parte">`);
}
function salvarDivisao(id) {
  const p = propCache[id], pl = p.payload || {};
  const partes = [...document.querySelectorAll(`.d-parte-${id}`)].map(i => i.value.trim()).filter(Boolean)
    .map(nome => ({ nome, nivel: pl.nivel || 'topico', parent_id: pl.parent_id || null, parent_proposta_id: pl.parent_proposta_id || null }));
  if (partes.length < 2) { toast('Informe pelo menos 2 partes', false); return; }
  decidir(id, 'dividida', { partes });
}

// =====================================================================
// SOLICITAÇÕES (fila pública de editais)
// =====================================================================
async function loadSolicitacoes() {
  const pane = $('pane-solicitacoes');
  pane.innerHTML = `
    <div class="pagetitle">S O L I C I T A Ç Õ E S</div>
    <div class="pagesub">Editais pedidos pelos alunos — os mais votados primeiro.</div>
    <div id="solLista"><div class="empty">carregando…</div></div>`;
  const { data, error } = await sb.rpc('fn_admin_solicitacoes_listar');
  if (error) { $('solLista').innerHTML = `<div class="card empty">${esc(error.message)}</div>`; return; }
  $('solLista').innerHTML = (data || []).map(r => `
    <div class="card" id="sol-${r.id}">
      <div class="nome">${esc(r.concurso)} <span class="conf mono">${r.votos} voto(s)</span></div>
      <div class="meta">${esc(r.detalhe || '')} · ${new Date(r.created_at).toLocaleDateString('pt-BR')}
        · <span class="badge ${r.status === 'aberta' ? 'grey' : r.status === 'atendida' ? 'edge' : ''}">${esc(r.status)}</span></div>
      <div class="acts">
        ${['aberta','em_preparacao','atendida','recusada'].map(s =>
          `<button class="${s === r.status ? 'b-ok' : 'b-ghost'}" onclick="mudarSolicitacao('${r.id}','${s}')">${s.replace('_',' ')}</button>`).join('')}
      </div>
    </div>`).join('') || '<div class="card empty">Nenhuma solicitação.</div>';
}
async function mudarSolicitacao(id, s) {
  const { error } = await sb.rpc('fn_admin_solicitacao_status', { p_id: id, p_status: s });
  if (error) { toast(error.message, false); return; }
  toast('Solicitação: ' + s.replace('_', ' ') + ' ✓'); loadSolicitacoes(); atualizarBadges();
}

boot();
</script>
